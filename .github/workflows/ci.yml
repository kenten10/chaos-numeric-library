name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # np.intp is 32-bit on Windows and the BLAS differs on macOS, so cover
        # both on the newest interpreter rather than only on Linux.
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report

  minimum-dependencies:
    name: Test against the declared dependency floor
    runs-on: ubuntu-latest
    # A lower bound nobody tests is a guess. This job is what makes the floor in
    # pyproject.toml a claim rather than a hope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the oldest supported NumPy and SciPy
        run: |
          python -m pip install "numpy==1.26.4" "scipy==1.11.4"
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=9,<10"
      - name: Report the resolved versions
        run: python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: Test
        run: pytest

  quality:
    name: Lint, format, and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev,test]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy

  documentation:
    name: Executable documentation and examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Execute Markdown code blocks
        run: pytest tests/test_documentation.py
      - name: Run all tutorials
        run: |
          for tutorial in docs/tutorials/*.py; do
            python "$tutorial"
          done
      - name: Run all examples
        run: |
          for example in examples/*.py; do
            if [ "$example" = "examples/parameter_sweep.py" ]; then
              python "$example" --output "${RUNNER_TEMP}/parameter-sweep"
            else
              python "$example"
            fi
          done

  notebook:
    name: Execute the reproduction notebook
    runs-on: ubuntu-latest
    # About five minutes per run, so it guards the default branch and releases
    # rather than every pull-request push. Run it by hand with workflow_dispatch
    # when a change touches the reproduced results.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package with plotting and notebook tools
        run: python -m pip install ".[plot]" nbconvert ipykernel
      - name: Execute notebooks without writing them back
        run: |
          for notebook in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=2400 \
              --output-dir "${RUNNER_TEMP}" "$notebook"
          done

  benchmark:
    name: Performance regression thresholds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Check allocation and scaling gates, report timing
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        # This is a shared runner, so timing is reported but never blocking
        # (numerical-standards.md section 12). Allocation and scaling gates are
        # deterministic and do block.
        run: python benchmarks/benchmark_suite.py --mode smoke --check

  package:
    name: Build and clean-install distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release tools
        run: python -m pip install ".[release]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/chaos-wheel
          /tmp/chaos-wheel/bin/python -m pip install dist/*.whl
          /tmp/chaos-wheel/bin/python -c "import chaos_numerics; print(chaos_numerics.__version__)"
      - name: Install sdist in a clean environment
        run: |
          python -m venv /tmp/chaos-sdist
          /tmp/chaos-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/chaos-sdist/bin/python -c "import chaos_numerics; print(chaos_numerics.__version__)"
