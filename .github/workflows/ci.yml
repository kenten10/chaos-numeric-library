name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test
        run: pytest

  quality:
    name: Lint, format, and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev,test]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy

  documentation:
    name: Executable documentation and examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run all tutorials
        run: |
          for tutorial in docs/tutorials/*.py; do
            python "$tutorial"
          done
      - name: Run all examples
        run: |
          for example in examples/*.py; do
            if [ "$example" = "examples/parameter_sweep.py" ]; then
              python "$example" --output "${RUNNER_TEMP}/parameter-sweep"
            else
              python "$example"
            fi
          done

  benchmark:
    name: Performance regression thresholds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Check benchmark thresholds
        run: python benchmarks/benchmark_suite.py --check

  package:
    name: Build and clean-install distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release tools
        run: python -m pip install ".[release]"
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/chaos-wheel
          /tmp/chaos-wheel/bin/python -m pip install dist/*.whl
          /tmp/chaos-wheel/bin/python -c "import chaos_numerics; print(chaos_numerics.__version__)"
      - name: Install sdist in a clean environment
        run: |
          python -m venv /tmp/chaos-sdist
          /tmp/chaos-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/chaos-sdist/bin/python -c "import chaos_numerics; print(chaos_numerics.__version__)"
