[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chaos-numerics"
version = "0.1.0.dev0"
description = "Numerical tools for reproducible experiments in classical and quantum chaos"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Kensuke Yoshida" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.17,<2",
]

[project.urls]
Repository = "https://github.com/kenten10/chaos-numeric-library"
Issues = "https://github.com/kenten10/chaos-numeric-library/issues"
Changelog = "https://github.com/kenten10/chaos-numeric-library/blob/main/CHANGELOG.md"
Security = "https://github.com/kenten10/chaos-numeric-library/security/policy"

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
]
dev = [
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff==0.15.14",
]
plot = [
    "matplotlib>=3.10,<4",
]
release = [
    "build==1.4.0",
    "twine==6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_numerics"]

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.15.14"
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
files = ["src", "tests"]
strict = true
extra_checks = true
implicit_reexport = false
show_error_codes = true
show_error_context = true
pretty = true
warn_unreachable = true
warn_unused_configs = true
